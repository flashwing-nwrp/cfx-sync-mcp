name: CI
on: [push, pull_request]
jobs:
  # Full test matrix on Linux — unit + integration across supported Node LTS versions.
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-22.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run grep-guard
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm audit --audit-level=high

  # Windows build check — typecheck + lint + grep-guard + build.
  # Skips unit + integration tests because a handful race against Windows
  # file-handle semantics that differ from POSIX (downloader stream-flush
  # timing, unzipper staging cleanup). Production code is cross-platform;
  # the gap is in test-harness cleanup ordering. Tracked as a follow-up.
  build-windows:
    runs-on: windows-2022
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run grep-guard
      - run: npm run build
